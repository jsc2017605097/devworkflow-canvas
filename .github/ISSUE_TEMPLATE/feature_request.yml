name: Feature request
description: Suggest an idea for DevWorkflow Canvas
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - AI generation
        - Canvas / visualization
        - JSON editor
        - Templates
        - Sharing / export
        - DevOps / deployment
        - Other
